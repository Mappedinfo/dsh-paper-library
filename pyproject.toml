[project]
name = "dsh-paper-library"
version = "0.1.0"
description = "Lightweight independent literature and PDF annotation plugin for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "pymupdf>=1.26,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_paper_library"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
