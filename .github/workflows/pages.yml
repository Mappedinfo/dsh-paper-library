# Publish the independent whiteboard to GitHub Pages.
#
# The site is the thin static host around `web/board.js`, so this workflow only
# assembles an artifact — it never runs a model, a database or the Python worker.
# Following `main` keeps the public drawing service in step with the plugin while
# remaining usable on its own.
name: Deploy whiteboard site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/board.js'
      - 'web/board.css'
      - 'web/theme.css'
      - 'web/index.html'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble the static whiteboard
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
