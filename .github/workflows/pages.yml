# 发布独立画板、文档及浏览器知识库。
#
# CI 用合成资料验证网页程序，发布浏览器计算所需的静态资源和许可。
name: Deploy Paper Library Pages

on:
  push:
    branches: [main]
    paths:
      # Every web asset is a site asset: the drawing service is assembled from `web/`, so a
      # change to any file there — not only the four that used to be listed — must redeploy.
      - 'site/**'
      - 'web/**'
      - 'docs-site/**'
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - 'LICENSE'
      - 'licenses/**'
      - 'tests-js/browser-*.test.mjs'
      - 'scripts/build-browser-*.mjs'
      - 'vendor/browser-tex/**'
      - 'scripts/build-site.mjs'
      - 'scripts/build-docs-site.mjs'
      - 'scripts/build-paper-flow.mjs'
      - 'src/paper-flow/**'
      - 'vendor/paper-flow/**'
      - 'examples/paper-flow-teaching.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Assemble the static site
        run: node scripts/build-site.mjs
      - name: Verify browser library
        run: node --test tests-js/browser-*.test.mjs
        env:
          PAGES_ARTIFACT: _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
