# Publish the independent whiteboard and the documentation site to GitHub Pages.
#
# The board is the thin static host around `web/board.js` and keeps the Pages root; the docs
# site is generated from this repository's own markdown by `scripts/build-docs-site.mjs` and is
# published beside it under `/docs/`. This workflow only assembles an artifact — it never runs a
# model, a database or the Python worker.
# Following `main` keeps the public drawing service in step with the plugin while
# remaining usable on its own.
name: Deploy whiteboard site

on:
  push:
    branches: [main]
    paths:
      # Every web asset is a site asset: the drawing service is assembled from `web/`, so a
      # change to any file there — not only the four that used to be listed — must redeploy.
      - 'site/**'
      - 'web/**'
      - 'docs-site/**'
      - 'docs/**'
      - 'README.md'
      - 'README.en.md'
      - 'scripts/build-site.mjs'
      - 'scripts/build-docs-site.mjs'
      - 'scripts/build-paper-flow.mjs'
      - 'src/paper-flow/**'
      - 'vendor/paper-flow/**'
      - 'examples/paper-flow-teaching.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Assemble the static whiteboard
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
