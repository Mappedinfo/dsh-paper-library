<!doctype html>
<html lang="zh-CN" data-palette="jade">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>文献画板 · Paper Library Whiteboard</title>
  <meta name="description" content="独立运行的文献画板：自由画布、思维导图整理、PNG 与 JSON 导出。DSH 插件里的画板与它共用同一份画布代码。">
  <link rel="stylesheet" href="./library/ui/style.css">
  <link rel="stylesheet" href="./library/ui/workbench.css">
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./library/ui/icons.css">
  <link rel="stylesheet" href="./board.css">
  <link rel="stylesheet" href="./board-annotations.css">
  <link rel="stylesheet" href="./floating-windows.css">
  <link rel="stylesheet" href="./library/auxiliary.css">
  <script src="./library/ui/theme.js" defer></script>
  <script src="./library/appearance.js" defer></script>
</head>
<body data-floating-windows class="standalone-page standalone-board">
  <header class="topbar site-header">
    <div class="brand-group"><a class="brand" href="./library/">Paper Library</a><strong class="toolbar-paper">文献画板</strong></div>
    <nav class="topbar-actions" aria-label="画板操作">
      <a class="button subtle" href="./library/">返回知识库</a>
      <button id="site-export-json" class="button subtle" type="button" title="把全部画板导出为一个 JSON 文件">导出 JSON</button>
      <button id="site-import-json" class="button subtle" type="button" title="从导出的 JSON 文件恢复画板；同标识会导入为新画板">导入 JSON</button>
      <button id="site-export-png" class="button subtle" type="button" title="把当前画板导出为 PNG 图片">导出 PNG</button>
      <input id="site-import-file" type="file" accept="application/json,.json" hidden>
    </nav>
  </header>
  <!--BOARD_MARKUP-->
  <footer class="board-storage-footer site-foot">
    <span>画板保存在此浏览器，可导出 JSON 备份。</span>
    <span id="site-storage-status" role="status"></span>
    <a href="./licenses/paper-flow/README.txt">流程组件与许可</a>
    <a href="https://github.com/Mappedinfo/dsh-paper-library" target="_blank" rel="noreferrer noopener">GitHub 源码</a>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="./board-flow.js" defer></script>
  <script src="./floating-windows.js" defer></script>
  <script src="./board-source.js" defer></script>
  <script src="./board-render.js" defer></script>
  <script src="./board-bridge.js" defer></script>
  <script src="./board-annotations.js" defer></script>
  <script src="./board-mermaid.js" defer></script>
  <script src="./board-drawio.js" defer></script>
  <script src="./board.js" defer></script>
  <script src="./standalone.js" defer></script>
</body>
</html>
